[package]
license = "MIT"
authors = ["Jeff Rogers"]
name = "retroft"
version.workspace = true
edition.workspace = true
description = "Retroft: bounded, triggered ftrace collection for Linux"

[features]
default = ["lz4"]
lz4 = ["dep:lz4"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
retroft-format = { path = "../retroft-format" }
io-uring.workspace = true
libc.workspace = true
humantime.workspace = true
serde.workspace = true
serde_json.workspace = true
lz4 = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
